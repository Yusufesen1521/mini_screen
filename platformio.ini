; mini_screen - ESP32-S3 DevKitC-1 (N16R8) + Lockerbox 3.2" ILI9341 240x320
;
; TFT_eSPI yapilandirmasinin tamami burada. Kutuphanenin User_Setup.h dosyasi
; DEGISTIRILMEZ: -DUSER_SETUP_LOADED=1 ile tum tanimlar buradan verilir, boylece
; kutuphane guncellemesi ayarlari silmez.

[platformio]
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------------
; Ekran SPI hizi. Breadboard uzerinde 40 MHz kararsiz olabilir.
; Ekranda bozulma / karlanma / rastgele pikseller gorursen sirayla dene:
; 27000000, sonra 20000000.
; ---------------------------------------------------------------------------
[display]
spi_frequency      = 40000000
spi_read_frequency = 20000000

; ---------------------------------------------------------------------------
; TFT_eSPI tanimlari. MISO bilerek tanimlanmadi (kablo bagli degil).
; Dokunmatik (XPT2046) tanimi yok, panel donanimda mevcut degil.
; Arka isik (LED pini) TFT_eSPI'ye birakilmiyor, LEDC ile PWM surulyor;
; bu yuzden TFT_BL / TFT_BACKLIGHT_ON tanimlanmadi.
;
; USE_FSPI_PORT SART. TFT_eSPI 2.5.43 ESP32-S3'te hicbiri tanimli degilse
; SPI_PORT makrosunu FSPI (= 0) yapiyor, REG_SPI_BASE(0) ise 0 donduruyor.
; Sonuc: kutuphane 0x10 adresine yaziyor ve tft.init() icinde StoreProhibited
; ile cokuyor. USE_FSPI_PORT ile SPI_PORT 2 olur (SPI2 = FSPI), bu da
; GPIO 10/11/12 pinlerinin IOMUX karsiligi ve en hizli yol.
; Alternatif USE_HSPI_PORT ise SPI3 kullanir, o da calisir ama GPIO matrisi
; uzerinden gider.
; ---------------------------------------------------------------------------
[tft_espi]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=10
    -DTFT_RST=9
    -DTFT_DC=14
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DSPI_FREQUENCY=${display.spi_frequency}
    -DSPI_READ_FREQUENCY=${display.spi_read_frequency}
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:esp32-s3-devkitc-1]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB flash + 8 MB oktal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    ${tft_espi.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
